<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate Item</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 28px;
    }

    .back-link {
      color: #111827;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      width: min(900px, 92%);
      margin: 40px auto;
      padding-bottom: 50px;
    }

    .page-heading {
      margin-bottom: 24px;
    }

    .page-heading h1 {
      font-size: 2rem;
      margin-bottom: 10px;
    }

    .page-heading p {
      color: #6b7280;
      line-height: 1.6;
    }

    .form-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.05);
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 1rem;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    .upload-area {
      border: 2px dashed #cbd5e1;
      border-radius: 12px;
      padding: 22px;
      background: #f8fafc;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .preview-grid img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
    }

    .button-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 24px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .primary-button {
      background: #111827;
      color: #ffffff;
    }

    .secondary-button {
      background: #e5e7eb;
      color: #111827;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #374151;
    }

    .message.success { background: #ecfdf5; color: #065f46; }
    .message.error { background: #fef2f2; color: #991b1b; }

    .locator-button {
      margin-top: 8px;
      background: #e5e7eb;
      color: #111827;
    }

    .locator-status {
      margin: 8px 0 0;
      font-size: .9rem;
      color: #166534;
      overflow-wrap: anywhere;
    }

    .locator-status.error { color: #991b1b; }
  </style>
<style>
[hidden] { display:none !important; }
.auth-shell { font:16px/1.6 Arial,sans-serif; color:#1f2937; background:#f4f6f8; padding:32px; min-height:100vh; }
.auth-shell button,.auth-account button { padding:10px 16px; border:1px solid #cbd5e1; border-radius:8px; background:#fff; color:#111827; cursor:pointer; }
.auth-account { display:flex; gap:12px; justify-content:flex-end; align-items:center; padding:10px 24px; background:#fff; border-bottom:1px solid #e5e7eb; font:14px Arial,sans-serif; }
.auth-account span { margin-right:auto; }
.dev-princess { color:#542064; font:16px/1.6 Arial,sans-serif; }
.dev-princess button { display:block; width:100%; margin:12px 0; padding:14px 20px; border:2px solid #b7358b; border-radius:28px; background:linear-gradient(135deg,#ffe0ef,#e8d9ff); color:#542064; font:700 16px/1.4 Arial,sans-serif; cursor:pointer; box-shadow:0 5px 16px #c9469d33; }
.dev-princess button:hover { background:#f9c3e7; }
.dev-princess button:focus-visible { outline:3px solid #542064; outline-offset:4px; }
.dev-princess button:disabled { opacity:.6; cursor:wait; }
.dev-princess .dev-floating { position:fixed; bottom:16px; left:16px; width:auto; z-index:100; margin:0; }
.dev-princess .dev-dialog { margin:auto; padding:28px; width:min(460px,calc(100% - 32px)); max-height:85vh; overflow:auto; border:3px solid #cb5ba9; border-radius:32px; background:radial-gradient(circle at 15% 10%,#fff 0 2px,transparent 3px),linear-gradient(135deg,#fff0f8,#eee1ff); background-size:24px 24px,auto; color:#542064; box-shadow:0 16px 80px #7e227c55; }
.dev-dialog::backdrop { background:#29143199; }
.dev-dialog p { margin:12px 0; }
.dev-selector { max-width:720px; margin:40px auto; padding:32px; border:3px solid #cb5ba9; border-radius:40px; background:linear-gradient(140deg,#fff0f8,#eadbff); box-shadow:0 18px 60px #cb5ba933; text-align:center; }
.dev-selector h1 { font-size:clamp(1.6rem,5vw,2.5rem); }
.dev-selector .flowers { font-size:2rem; letter-spacing:.3em; }
@media (prefers-reduced-motion:no-preference) { .dev-princess button { transition:background .15s,box-shadow .15s; } }
@media (max-width:480px) { .dev-selector { margin:20px 12px; padding:20px; } .auth-account { flex-wrap:wrap; } }
</style>
  <script defer src="../../shared/frontend/navigation.js"></script>
  <script defer src="../../shared/frontend/public-config.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
  <script defer src="../../shared/frontend/supabase-client.js"></script>
  <script defer src="../../shared/frontend/auth-policy.js"></script>
  <script defer src="../../shared/frontend/auth.js"></script>
  <script defer src="../../shared/frontend/developer-mode.js"></script>
  <script defer src="../../shared/frontend/auth-guard.js"></script>
</head>

<body data-auth-area="community_user">
<section id="auth-shell" class="auth-shell"><p role="status">Checking your account…</p><button type="button" data-auth-retry>Retry</button> <button type="button" data-auth-logout>Sign out</button><noscript><p>JavaScript is required to sign in and verify access.</p></noscript></section>
<div id="protected-content" hidden>
<div class="auth-account"><span data-auth-name></span><button type="button" data-auth-logout>Sign out</button></div>
  <header>
    <a class="back-link" href="community-user_dashboard.html">← Back to Dashboard</a>
  </header>

  <main>
    <section class="page-heading">
      <h1>Donate an Item</h1>
      <p>
        Add an item you want to give away for free. Include pictures, a clear
        description, and the time when the item is available for collection.
      </p>
    </section>

    <section class="form-card">
      <form id="donationForm">
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input
            id="itemName"
            name="itemName"
            type="text"
            placeholder="Example: Winter jackets"
            required
          />
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="">Select a category</option>
            <option value="food">Food</option>
            <option value="water">Water</option>
            <option value="clothing">Clothing</option>
            <option value="school_supplies">School Supplies</option>
            <option value="household_goods">Household Goods</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            name="description"
            placeholder="Describe the item, condition, quantity, size, or anything else people should know."
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="quantity">Quantity</label>
          <input
            id="quantity"
            name="quantity"
            type="number"
            min="1"
            value="1"
            required
          />
        </div>

        <div class="form-group">
          <label for="location">Collection Area / Location</label>
          <input
            id="location"
            name="location"
            type="text"
            placeholder="Example: Hatfield, Pretoria"
            required
          />
          <input type="hidden" id="donationLatitude" name="latitude" />
          <input type="hidden" id="donationLongitude" name="longitude" />
          <button type="button" class="locator-button" id="donationLocateButton">Use my current location</button>
          <p id="donationLocateStatus" class="locator-status" role="status" hidden></p>
        </div>

        <div class="form-group">
          <label for="availableFrom">Available From</label>
          <input
            id="availableFrom"
            name="availableFrom"
            type="datetime-local"
            required
          />
        </div>

        <div class="form-group">
          <label for="availableUntil">Available Until</label>
          <input
            id="availableUntil"
            name="availableUntil"
            type="datetime-local"
            required
          />
        </div>

        <div class="form-group upload-area">
          <label for="images">Upload Pictures</label>
          <input
            id="images"
            name="images"
            type="file"
            accept="image/*"
            multiple
          />
          <div id="previewGrid" class="preview-grid"></div>
        </div>

        <div class="button-row">
          <button class="primary-button" type="submit">
            Upload Donation
          </button>

          <button
            id="browseRequestsButton"
            class="secondary-button"
            type="button"
          >
            Browse Requests
          </button>
        </div>

        <div id="message" class="message"></div>
      </form>
    </section>
  </main>

  <script src="../../shared/frontend/location.js"></script>
  <script src="community-user_donate.js"></script>
</div>
</body>
</html>
