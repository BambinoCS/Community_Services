<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Report a Problem</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--dark:#111827;--danger:#b91c1c;--danger-bg:#fee2e2;--success:#15803d;--success-bg:#dcfce7;--info:#1d4ed8;--info-bg:#dbeafe;--radius:12px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px}.back{color:var(--dark);text-decoration:none;font-weight:700}main{width:min(900px,92%);margin:34px auto 80px}.heading{margin-bottom:24px}h1{font-size:1.9rem;margin-bottom:8px}.heading p{color:var(--muted);line-height:1.6}.card{background:var(--surface);border-radius:16px;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.05)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.full{grid-column:1/-1}.group{margin-bottom:0}label{display:block;font-weight:700;margin-bottom:7px;font-size:.92rem}input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:var(--radius);font:inherit;background:#fff;color:var(--text)}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus,button:focus,a:focus{outline:3px solid #93c5fd;outline-offset:1px}.hint{font-size:.82rem;color:var(--muted);margin-top:5px}.field-error{display:none;color:var(--danger);font-size:.83rem;margin-top:5px}.field-error.show{display:block}.invalid{border-color:var(--danger)}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}.check{display:flex;gap:9px;align-items:flex-start;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fafafa}.check input{width:auto;margin-top:3px}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}button,.btn{border:0;border-radius:var(--radius);padding:12px 18px;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;text-align:center}.primary{background:var(--dark);color:#fff}.secondary{background:#eef0f3;color:var(--dark)}button:disabled{opacity:.6;cursor:wait}.message-banner{display:none;margin-top:20px;padding:14px 16px;border-radius:var(--radius);line-height:1.5}.message-banner.show{display:block}.message-banner.success{background:var(--success-bg);color:var(--success)}.message-banner.error{background:var(--danger-bg);color:var(--danger)}.message-banner.info{background:var(--info-bg);color:var(--info)}.auth-shell{font:16px/1.6 Arial,sans-serif;padding:32px;background:var(--bg);min-height:100vh}.auth-shell button,.auth-account button{padding:10px 16px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer}.auth-account{display:flex;gap:12px;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--border)}.auth-account span{margin-right:auto}[hidden]{display:none!important}@media(max-width:680px){.form-grid,.checks{grid-template-columns:1fr}header{padding:16px 18px}.card{padding:20px}}
</style>
<script defer src="../../shared/frontend/navigation.js"></script>
<script defer src="../../shared/frontend/public-config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script defer src="../../shared/frontend/supabase-client.js"></script>
<script defer src="../../shared/frontend/auth-policy.js"></script>
<script defer src="../../shared/frontend/auth.js"></script>
<script defer src="../../shared/frontend/developer-mode.js"></script>
<script defer src="../../shared/frontend/auth-guard.js"></script>
</head>
<body data-auth-area="community_user">
<section id="auth-shell" class="auth-shell"><p role="status">Checking your account…</p><button type="button" data-auth-retry>Retry</button> <button type="button" data-auth-logout>Sign out</button></section>
<div id="protected-content" hidden><div class="auth-account"><span data-auth-name></span><button type="button" data-auth-logout>Sign out</button></div>
<header><a class="back" href="community-user_request-help.html">← Back to Request Help</a></header>
<main><section class="heading"><h1>Report a Problem</h1><p>Provide enough detail for the system and administrators to understand and review the issue.</p></section><section class="card"><form id="community-user_report-problemForm" novalidate><div class="form-grid"><div class="group"><label for="problemType">Problem type *</label><select id="problemType" required><option value="">Select a problem type</option><option value="community_issue">Community issue</option><option value="platform_issue">Platform issue</option><option value="safety_issue">Safety issue</option><option value="service_issue">Service issue</option><option value="other_issue">Other issue</option></select><div id="problemTypeError" class="field-error"></div></div><div class="group"><label for="problemUrgency">Urgency *</label><select id="problemUrgency" required><option value="">Select urgency</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select><div id="problemUrgencyError" class="field-error"></div></div><div class="group full"><label for="problemLocation">Location of the problem *</label><input id="problemLocation" maxlength="250" placeholder="Street, area, landmark, or other useful location details" required><input type="hidden" id="problemLatitude"><input type="hidden" id="problemLongitude"><button type="button" id="problemLocateButton" class="btn secondary">Use my current location</button><p id="problemLocateStatus" role="status" hidden></p><div id="problemLocationError" class="field-error"></div></div><div class="group full"><label for="problemDescription">Problem description *</label><textarea id="problemDescription" maxlength="1000" placeholder="Describe what happened, what is wrong, and what attention is needed." required></textarea><div id="problemDescriptionError" class="field-error"></div></div><div class="group full"><label for="problemAdditional">Additional information</label><textarea id="problemAdditional" maxlength="1000" placeholder="Add any other details that may help the team understand the problem."></textarea></div></div><div class="actions"><a class="btn secondary" href="community-user_request-help.html">Cancel</a><button class="primary" type="submit">Submit Problem Report</button></div></form><div id="message" class="message-banner" role="status" aria-live="polite"></div></section></main>
<script defer src="../../shared/frontend/location.js"></script><script src="../../shared/frontend/validation.js"></script><script src="../../shared/frontend/ui.js"></script><script src="community-api.js"></script><script src="community-user_report-problem.js"></script>
</div></body></html>
