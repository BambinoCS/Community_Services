<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Request Service</title>
<style>
:root{--bg:#f4f6f8;--surface:#fff;--border:#e5e7eb;--text:#1f2937;--muted:#6b7280;--dark:#111827;--danger:#b91c1c;--danger-bg:#fee2e2;--success:#15803d;--success-bg:#dcfce7;--info:#1d4ed8;--info-bg:#dbeafe;--radius:12px}*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px}.back{color:var(--dark);text-decoration:none;font-weight:700}main{width:min(900px,92%);margin:34px auto 80px}.heading{margin-bottom:24px}h1{font-size:1.9rem;margin-bottom:8px}.heading p{color:var(--muted);line-height:1.6}.card{background:var(--surface);border-radius:16px;padding:28px;box-shadow:0 8px 24px rgba(0,0,0,.05)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.full{grid-column:1/-1}.group{margin-bottom:0}label{display:block;font-weight:700;margin-bottom:7px;font-size:.92rem}input,textarea,select{width:100%;padding:12px 13px;border:1px solid #d1d5db;border-radius:var(--radius);font:inherit;background:#fff;color:var(--text)}textarea{min-height:110px;resize:vertical}input:focus,textarea:focus,select:focus,button:focus,a:focus{outline:3px solid #93c5fd;outline-offset:1px}.hint{font-size:.82rem;color:var(--muted);margin-top:5px}.field-error{display:none;color:var(--danger);font-size:.83rem;margin-top:5px}.field-error.show{display:block}.invalid{border-color:var(--danger)}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}.check{display:flex;gap:9px;align-items:flex-start;padding:11px;border:1px solid var(--border);border-radius:10px;background:#fafafa}.check input{width:auto;margin-top:3px}.actions{display:flex;gap:12px;justify-content:flex-end;margin-top:24px;flex-wrap:wrap}button,.btn{border:0;border-radius:var(--radius);padding:12px 18px;font-weight:700;font-size:.95rem;cursor:pointer;text-decoration:none;text-align:center}.primary{background:var(--dark);color:#fff}.secondary{background:#eef0f3;color:var(--dark)}button:disabled{opacity:.6;cursor:wait}.message-banner{display:none;margin-top:20px;padding:14px 16px;border-radius:var(--radius);line-height:1.5}.message-banner.show{display:block}.message-banner.success{background:var(--success-bg);color:var(--success)}.message-banner.error{background:var(--danger-bg);color:var(--danger)}.message-banner.info{background:var(--info-bg);color:var(--info)}.auth-shell{font:16px/1.6 Arial,sans-serif;padding:32px;background:var(--bg);min-height:100vh}.auth-shell button,.auth-account button{padding:10px 16px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer}.auth-account{display:flex;gap:12px;align-items:center;padding:10px 24px;background:#fff;border-bottom:1px solid var(--border)}.auth-account span{margin-right:auto}[hidden]{display:none!important}@media(max-width:680px){.form-grid,.checks{grid-template-columns:1fr}header{padding:16px 18px}.card{padding:20px}}
</style>
<script defer src="../../shared/frontend/navigation.js"></script>
<script defer src="../../shared/frontend/public-config.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script defer src="../../shared/frontend/supabase-client.js"></script>
<script defer src="../../shared/frontend/auth-policy.js"></script>
<script defer src="../../shared/frontend/auth.js"></script>
<script defer src="../../shared/frontend/developer-mode.js"></script>
<script defer src="../../shared/frontend/service-requests.js"></script>
<script defer src="../../shared/frontend/auth-guard.js"></script>
</head>
<body data-auth-area="community_user">
<section id="auth-shell" class="auth-shell"><p role="status">Checking your account…</p><button type="button" data-auth-retry>Retry</button> <button type="button" data-auth-logout>Sign out</button></section>
<div id="protected-content" hidden><div class="auth-account"><span data-auth-name></span><button type="button" data-auth-logout>Sign out</button></div>
<header><a class="back" href="community-user_request-help.html">← Back to Request Help</a></header>
<main><section class="heading"><h1>Request Service</h1><p>Select an approved community service, describe the problem being addressed, and provide where and when assistance is needed.</p></section><section class="card"><form id="community-user_request-serviceForm" novalidate><div class="group full"><label>Service requested *</label><div class="checks"><label class="check"><input type="radio" name="serviceCategory" value="food_water_delivery">Collecting and delivering food or water</label><label class="check"><input type="radio" name="serviceCategory" value="elderly_vulnerable_assistance">Assisting elderly or vulnerable residents</label><label class="check"><input type="radio" name="serviceCategory" value="public_transport_accompaniment">Accompanying residents to public transport facilities</label><label class="check"><input type="radio" name="serviceCategory" value="healthcare_access">Helping people reach healthcare facilities</label><label class="check"><input type="radio" name="serviceCategory" value="grocery_collection">Collecting groceries</label><label class="check"><input type="radio" name="serviceCategory" value="donated_resource_delivery">Delivering donated resources</label><label class="check"><input type="radio" name="serviceCategory" value="other_approved_service">Providing other approved community services</label></div><div id="serviceCategoryError" class="field-error"></div></div><div class="group full"><label>Problems addressed</label><div class="checks"><label class="check"><input type="checkbox" name="problemsAddressed" value="food_access">Food access</label><label class="check"><input type="checkbox" name="problemsAddressed" value="water_access">Water access</label><label class="check"><input type="checkbox" name="problemsAddressed" value="transport_access">Transport access</label><label class="check"><input type="checkbox" name="problemsAddressed" value="healthcare_access">Healthcare access</label><label class="check"><input type="checkbox" name="problemsAddressed" value="elderly_vulnerable_support">Elderly or vulnerable resident support</label><label class="check"><input type="checkbox" name="problemsAddressed" value="resource_delivery">Resource delivery</label><label class="check"><input type="checkbox" name="problemsAddressed" value="other">Other</label></div></div><div class="group"><label for="serviceLocation">Location *</label><input id="serviceLocation" maxlength="200" required placeholder="Where is the help needed?"><div id="serviceLocationError" class="field-error"></div></div><div class="group"><label for="serviceUrgency">Urgency *</label><select id="serviceUrgency" required><option value="">Select urgency</option><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select><div id="serviceUrgencyError" class="field-error"></div></div><div class="group"><label for="servicePreferredDate">Preferred date (SAST) *</label><input id="servicePreferredDate" type="date" required><div id="servicePreferredDateError" class="field-error"></div></div><div class="group"><label for="servicePreferredTime">Preferred time (SAST) *</label><input id="servicePreferredTime" type="time" required><div id="servicePreferredTimeError" class="field-error"></div></div><div class="group full"><label for="serviceDescription">What do you need? *</label><textarea id="serviceDescription" maxlength="1000" required placeholder="Explain the assistance you need."></textarea><div id="serviceDescriptionError" class="field-error"></div></div><div class="group full"><label for="serviceAdditional">Additional information</label><textarea id="serviceAdditional" maxlength="1000" placeholder="Add useful details such as access instructions or special considerations."></textarea></div><div class="actions"><a class="btn secondary" href="community-user_request-help.html">Cancel</a><button class="primary" type="submit">Submit Service Request</button></div></form><div id="message" class="message-banner" role="status" aria-live="polite"></div></section></main>
<script src="../../shared/frontend/validation.js"></script><script src="../../shared/frontend/ui.js"></script><script src="community-api.js"></script><script src="community-user_request-service.js"></script>
</div></body></html>
